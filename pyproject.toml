[project]
name = "saml-metadata-parser"
version = "2.2.0"
description = "Web page for reading SAML 2.0 metadata: entity ID, role, endpoints and certificates."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "Flask>=3.0,<4",
    "Werkzeug>=3.0,<4",
    "Authlib>=1.3,<2",
    "requests>=2.31,<3",
    "lxml>=5.1,<7",
    "cryptography>=42",
    "python-dotenv>=1.0,<2",
    "markdown>=3.5,<4",
    "gunicorn>=22,<24",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.3",
    "ruff>=0.6",
    "deptry>=0.20",
    "pip-audit>=2.7",
]

[project.scripts]
saml-metadata-parser = "app:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["app", "howto", "saml_ui_parser_logic"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "T20", "BLE", "S110", "S112"]

[tool.deptry]
pep621_dev_dependency_groups = ["dev"]

[tool.deptry.per_rule_ignores]
# gunicorn is the container's server process; the code never imports it.
DEP002 = ["gunicorn"]
